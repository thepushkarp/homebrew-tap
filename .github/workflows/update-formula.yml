name: Update Formula

on:
  repository_dispatch:
    types: [mls-release, nalcos-release]

permissions:
  contents: write

concurrency:
  group: release-formula-updates
  cancel-in-progress: false

jobs:
  update:
    name: Update release formula
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Update formula
        id: release
        run: python3 scripts/update_formula.py

      - name: Verify formulae
        run: |
          for formula in Formula/*.rb; do ruby -c "$formula"; done
          grep -q 'depends_on "ffmpeg"' Formula/mls.rb
          grep -q 'depends_on "mpv"' Formula/mls.rb
          grep -q 'depends_on "git"' Formula/nalcos.rb
          python3 -m unittest discover -s tests

      - name: Commit and push
        env:
          FORMULA: ${{ steps.release.outputs.formula }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Formula/$FORMULA.rb"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "$FORMULA $VERSION"
          git push
