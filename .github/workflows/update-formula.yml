name: Update Formula

on:
  repository_dispatch:
    types: [mls-release, nalcos-release]

permissions:
  contents: write

jobs:
  update:
    name: Update release formula
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Update formula
        id: release
        run: python3 scripts/update_formula.py

      - name: Verify and publish formula
        env:
          FORMULA: ${{ steps.release.outputs.formula }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          push_log="$RUNNER_TEMP/formula-push.log"
          for attempt in 1 2 3 4 5; do
            if (( attempt > 1 )); then
              git fetch origin main
              git checkout --detach FETCH_HEAD
              python3 scripts/update_formula.py
            fi
            for formula in Formula/*.rb; do ruby -c "$formula"; done
            grep -q 'depends_on "ffmpeg"' Formula/mls.rb
            grep -q 'depends_on "mpv"' Formula/mls.rb
            grep -q 'depends_on "git"' Formula/nalcos.rb
            python3 -m unittest discover -s tests
            git add "Formula/$FORMULA.rb"
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "$FORMULA $VERSION"
            if git push --porcelain origin HEAD:main >"$push_log" 2>&1; then
              cat "$push_log"
              exit 0
            fi
            cat "$push_log"
            if ! grep -Fq -e '[rejected] (fetch first)' -e '[rejected] (non-fast-forward)' "$push_log"; then
              echo "::error::Formula push failed for a reason other than a competing update."
              exit 1
            fi
            echo "::warning::Main changed during formula update (attempt $attempt/5); regenerating from the latest main."
          done
          echo "::error::Formula update could not be published after five competing updates."
          exit 1
